# HISTORISCH: Regelwerk für den Filter-Node.
#
# Diese Datei wird zur LAUFZEIT NICHT MEHR gelesen — mit der
# Alembic-Seed-Migration ac7556d5370e sind diese Werte in die
# filter_rules-Tabelle gewandert. load_filter_rules() liest jetzt
# aus der DB, editiert wird über die PUT /filter-rules-API.
#
# Die Datei bleibt als historische Quelle für die Seed-Migration
# im Repo (die Migration hardcodiert diese Werte als Anfangszustand).

# Titel, die zu einer Ablehnung führen (case-insensitive Substring-Match)
title_blacklist:
  - Senior
  - Lead
  - Principal
  - Staff
  - Head of
  - Architekt
  - Consultant
  - Berater
  - Werkstudent
  - Praktikum

# Obergrenze Berufserfahrung in Jahren — höhere Angaben im Text = Ablehnung
max_experience_years: 3

# Beschreibungs-Phrasen, die zu einer Ablehnung führen (case-insensitive)
description_blacklist:
  - Beratungsprojekte
  - Kundenprojekte vor Ort
